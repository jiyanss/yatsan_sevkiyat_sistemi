<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bilgi Yarışması</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Ana ekran -->
  <section id="screen-home" class="screen">
    <h1>🧠 Bilgi Yarışması</h1>
    <p class="muted">10 soru, 20 saniye. Liderlik tablosuna adını yazdır!</p>
    <input id="username" placeholder="Adın" maxlength="20" />
    <select id="category"></select>
    <button onclick="startQuiz()">Başla 🚀</button>
  </section>

  <!-- Oyun ekranı -->
  <section id="screen-quiz" class="screen hidden">
    <div class="topbar"><span id="progress"></span><span id="time">20</span></div>
    <h2 id="question"></h2>
    <div id="options"></div>
  </section>

  <!-- Sonuç ekranı -->
  <section id="screen-result" class="screen hidden">
    <h1 id="result-title"></h1>
    <p id="result-detail" class="muted"></p>
    <div id="review"></div>
    <h2>🏆 Liderlik Tablosu</h2>
    <ol id="leaderboard"></ol>
    <button onclick="location.reload()">Tekrar Oyna</button>
  </section>

  <script src="app.js"></script>
</body>
</html>
